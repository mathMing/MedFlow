# 基础通用配置
project_name: "MedVision-Research"
seed: 42
device: "auto" # "auto", "cuda", "cpu"
amp: true      # 自动混合精度，加速显卡训练并节省显存

# 飞书推送配置 (可在环境变量中设置，也可在此处填入)
feishu:
  enable: true
  webhook_url: "" # 填入飞书机器人的 Webhook 地址
  app_id: ""      # 选填：用于上传切片图片显示在卡片中
  app_secret: ""

# 训练通用参数
optimizer: "adamw"
lr: 0.001
weight_decay: 0.0001
val_interval: 1 # 每几个 Epoch 验证一次并推送到手机
save_dir: "experiments"
